[package]
name = "fable-plugin"
version = "1.0.0"
edition.workspace = true
description = "The interface Fableland plugins are written against"

# A plugin can use these crates through `fable_plugin::*` and nothing else from
# crates.io: a build with your plugins in it then needs no new downloads.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", features = ["json"] }
